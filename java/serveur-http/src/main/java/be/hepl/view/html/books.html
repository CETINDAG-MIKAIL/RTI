<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <link rel="stylesheet" href="../css/top-nav-bar.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/footer.css">

    <script src="../js/theme.js" defer></script>
    <script src="../js/http/add.js" defer></script>
    <script src="../js/http/update.js" defer></script>
    <script src="../js/http/delete.js" defer></script>
    <script src="../js/http/search.js" defer></script>
    <script src="../js/books.js" defer></script>
</head>
<body>
    <div id="navbar">
        <a href="index.html">Accueil</a>
        <a href="" id="active">Livres</a>
        <a href="authors.html">Auteurs</a>
        <a href="subjects.html">Sujets</a>
    </div>

    <h1>Gestion des livres</h1>

    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Titre</th>
                <th>Id auteur</th>
                <th>Nom auteur</th>
                <th>Prénom auteur</th>
                <th>Id sujet</th>
                <th>Nom sujet</th>
                <th>ISBN</th>
                <th>Nombre de pages</th>
                <th>Quantité</th>
                <th>Prix</th>
                <th>Année</th>
            </tr>
        </thead>
        <tbody id="table-books">
        </tbody>
    </table>

    <form action="/submit" method="POST">
        <label for="id">Id :</label>
        <input type="number" id="id" name="id" placeholder="Id du livre">
        <div id="id-error" class="error-message"></div>

        <label for="title">Titre :</label>
        <input type="text" id="title" name="title" placeholder="Titre du livre">
        <div id="title-error" class="error-message"></div>

        <label for="author-id">Id auteur :</label>
        <input type="number" id="author-id" name="author-id" placeholder="Id de l'auteur">
        <div id="author-id-error" class="error-message"></div>

        <label for="subject-id">Id sujet :</label>
        <input type="number" id="subject-id" name="subject-id" placeholder="Id du sujet">
        <div id="subject-id-error" class="error-message"></div>

        <label for="isbn">ISBN :</label>
        <input type="text" id="isbn" name="isbn" placeholder="ISBN du livre">
        <div id="isbn-error" class="error-message"></div>

        <label for="page-count">Nombre de pages :</label>
        <div class="select-and-field">
            <select name="page-count" id="page-count-select" class="select">
                <option value="minPageCount">Min</option>
                <option value="maxPageCount">Max</option>
            </select>
            <input type="text" id="page-count" name="page-count" placeholder="Nombre de pages">
        </div>
        <div id="page-count-error" class="error-message"></div>

        <label for="stock-quantity">Stock :</label>
        <div class="select-and-field">
            <select name="stock-quantity" id="stock-quantity-select" class="select">
                <option value="minStockQuantity">Min</option>
            </select>
            <input type="text" id="stock-quantity" name="stock-quantity" placeholder="Quantité en stock">
        </div>
        <div id="stock-quantity-error" class="error-message"></div>

        <label for="price">Prix :</label>
        <div class="select-and-field">
            <select name="price" id="price-select" class="select">
                <option value="minPrice">Min</option>
                <option value="maxPrice">Max</option>
            </select>
            <input type="text" id="price" name="price" placeholder="Prix du livre">
        </div>
        <div id="price-error" class="error-message"></div>

        <label for="publish-year">Année de publication :</label>
        <div class="select-and-field">
            <select name="publish-year" id="publish-year-select" class="select">
                <option value="minPublishYear">Min</option>
                <option value="maxPublishYear">Max</option>
            </select>
            <input type="text" id="publish-year" name="publish-year" placeholder="Année de publication">
        </div>
        <div id="publish-year-error" class="error-message"></div>

        <div id="info-message"></div>


        <button type="button" id="add-button">Ajouter</button>
        <button type="button" id="edit-button">Modifier</button>
        <button type="button" id="delete-button">Supprimer</button>
        <button type="button" id="search-button">Rechercher</button>
        <button type="button" id="empty-button">Vider les champs</button>
    </form>

    <footer>
        <span>&copy; 2024 Projet RTI. Tous droits réservés.</span>
    </footer>
</body>
</html>
